<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO</title>
    <link rel="stylesheet" href="style/custom_button.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/custom_input.css">

</head>
<body>
<div id="app">
    <div class="piece">
        <label>
            <input type="text" autocomplete="off" name="text" class="input"
                   placeholder="新的待办" v-model="newTodo">
        </label>
        <button type="button" class="button" @click="insertTodo()">
            <span class="button__text">添加</span>
            <span class="button__icon">+</span>
        </button>
    </div>
    <hr style="width: 100%;color: white"/>
    <div v-for="(item,index) in todoList">
        <div class="piece box">
            {{item}}
            <button type="button" class="button" @click="removeTodo(index)">
                <span class="button__text">完成</span>
                <span class="button__icon">✅</span>
            </button>
        </div>
    </div>

</div>



<script src="lib/vue.global.js"></script>
<script src="index.js"></script>
</body>
</html>
